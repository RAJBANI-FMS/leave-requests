<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلب إجازة | Leave Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17262b;--paper:#f2f5f4;--card:#fff;--brand:#0f5c4d;--brand-d:#0a463a;--line:#c9d3d0;--warn:#a84a08;--warn-bg:#fdf1e6;--ok:#0f5c4d}
@media (prefers-color-scheme:dark){:root{--ink:#e8efed;--paper:#0f1819;--card:#17252a;--brand:#46b59f;--brand-d:#6fd0bb;--line:#2f4349;--warn:#f0a468;--warn-bg:#2a2016;--ok:#46b59f}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
main{max-width:480px;margin:0 auto;padding:20px 0 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
h1{font-size:1.5rem;margin:0;font-weight:700}
.lang{display:flex;border:1.5px solid var(--brand);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang button{border:0;background:transparent;color:var(--brand);font:inherit;font-size:.9rem;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--paper)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
label,.legend{display:block;font-weight:500;margin:0 0 6px}
.field{margin-bottom:18px}
input[type=text],input[type=tel],input[type=date],textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:12px}
input:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:3px solid var(--brand);outline-offset:2px}
input[name=iqama]{direction:ltr;text-align:start;letter-spacing:.08em}
html[dir=rtl] input[name=iqama]{text-align:right}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;background:var(--paper)}
.opt input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.opt:has(input:checked){border-color:var(--brand);background:var(--card)}
#why-wrap{display:none;background:var(--warn-bg);border-inline-start:4px solid var(--warn);border-radius:8px;padding:14px;margin-bottom:18px}
#why-wrap.show{display:block}
#why-wrap label{color:var(--warn)}
textarea{min-height:96px;resize:vertical}
.send{width:100%;font:inherit;font-weight:700;font-size:1.05rem;background:var(--brand);color:var(--card);border:0;border-radius:8px;padding:14px;cursor:pointer}
.send:hover{background:var(--brand-d)}
.send:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-weight:500}
.msg.err{color:var(--warn)}
#done{display:none;text-align:center;padding:12px 0}
#done h2{color:var(--ok);margin:0 0 6px}
#done button{margin-top:12px;font:inherit;background:transparent;border:1.5px solid var(--brand);color:var(--brand);border-radius:8px;padding:10px 18px;cursor:pointer}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar" aria-pressed="true">عربي</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="card">
    <form id="f" novalidate>
      <div class="field">
        <label for="name" data-i18n="name"></label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="iqama" data-i18n="iqama"></label>
        <input id="iqama" name="iqama" type="tel" inputmode="numeric" maxlength="10" required>
      </div>
      <div class="field">
        <label for="date" data-i18n="date"></label>
        <input id="date" name="date" type="date" required>
      </div>
      <div class="field">
        <span class="legend" data-i18n="type"></span>
        <div class="opts">
          <label class="opt"><input type="radio" name="type" value="due" checked><span data-i18n="due"></span></label>
          <label class="opt"><input type="radio" name="type" value="emergency"><span data-i18n="emergency"></span></label>
        </div>
      </div>
      <div id="why-wrap">
        <label for="why" data-i18n="why"></label>
        <textarea id="why" name="why"></textarea>
      </div>
      <button class="send" type="submit" data-i18n="send"></button>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>
    <div id="done">
      <h2 data-i18n="okTitle"></h2>
      <p data-i18n="okText"></p>
      <button type="button" id="again" data-i18n="again"></button>
    </div>
  </div>
</main>

<script>
// ضع هنا رابط Google Apps Script بعد النشر (Web app URL)
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMUCNVbc4BNd9bqkszsPjuENEpa2U_ew0QrFpMINCFa5Jd1ZWLb45IFna2Lco4wJ-1/exec";

var T = {
  ar:{title:"طلب إجازة",name:"الاسم الكامل",iqama:"رقم الإقامة",date:"تاريخ الإجازة المتوقع",type:"نوع الإجازة",due:"إجازة مستحقة",emergency:"إجازة طارئة",why:"اشرح سبب الإجازة الطارئة",send:"إرسال الطلب",sending:"جارٍ الإرسال...",okTitle:"تم إرسال طلبك",okText:"سيتم التواصل معك بعد مراجعة الطلب.",again:"إرسال طلب آخر",eName:"اكتب اسمك الكامل.",eIqama:"رقم الإقامة يجب أن يكون 10 أرقام.",eDate:"اختر تاريخ الإجازة.",eWhy:"اكتب سبب الإجازة الطارئة.",eNet:"تعذر الإرسال. تحقق من الإنترنت وحاول مرة أخرى.",eCfg:"النموذج غير مربوط بعد. أضف رابط الاستقبال في الملف."},
  en:{title:"Leave Request",name:"Full name",iqama:"Residency (Iqama) number",date:"Expected leave date",type:"Leave type",due:"Due leave",emergency:"Emergency leave",why:"Explain the emergency",send:"Send request",sending:"Sending...",okTitle:"Request sent",okText:"We will contact you after reviewing it.",again:"Send another request",eName:"Enter your full name.",eIqama:"Iqama number must be 10 digits.",eDate:"Choose the leave date.",eWhy:"Describe the emergency.",eNet:"Could not send. Check your connection and try again.",eCfg:"The form is not connected yet. Add the receiving URL in the file."}
};
var lang = "ar";
var $ = function(s){return document.querySelector(s)};
var f = $("#f"), msg = $("#msg");

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.title = T[l].title;
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent = T[l][el.dataset.i18n]});
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang === l)});
  msg.textContent = "";
}
document.querySelectorAll("[data-lang]").forEach(function(b){b.addEventListener("click", function(){setLang(b.dataset.lang)})});

var today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
$("#date").min = today.toISOString().slice(0,10);

function isEmergency(){return f.type.value === "emergency"}
f.querySelectorAll("input[name=type]").forEach(function(r){
  r.addEventListener("change", function(){$("#why-wrap").classList.toggle("show", isEmergency())});
});

function fail(key, el){msg.className = "msg err"; msg.textContent = T[lang][key]; if(el) el.focus()}

f.addEventListener("submit", function(e){
  e.preventDefault();
  msg.className = "msg";
  var name = f.name.value.trim(), iqama = f.iqama.value.trim(), date = f.date.value, why = f.why.value.trim();
  if(!name) return fail("eName", f.name);
  if(!/^\d{10}$/.test(iqama)) return fail("eIqama", f.iqama);
  if(!date) return fail("eDate", f.date);
  if(isEmergency() && !why) return fail("eWhy", f.why);
  if(!SCRIPT_URL) return fail("eCfg");

  var btn = f.querySelector(".send");
  btn.disabled = true; btn.textContent = T[lang].sending;
  var payload = {name:name, iqama:iqama, date:date, type: isEmergency() ? "Emergency / طارئة" : "Due / مستحقة", why: isEmergency() ? why : "", lang:lang};

  fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)})
    .then(function(){f.style.display = "none"; $("#done").style.display = "block"})
    .catch(function(){fail("eNet")})
    .finally(function(){btn.disabled = false; btn.textContent = T[lang].send});
});

$("#again").addEventListener("click", function(){
  f.reset(); $("#why-wrap").classList.remove("show");
  $("#done").style.display = "none"; f.style.display = "block"; msg.textContent = "";
});

setLang("ar");
</script>
</body>
</html>
