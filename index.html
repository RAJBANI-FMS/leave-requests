<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17262b;--paper:#f2f5f4;--card:#fff;--brand:#0f5c4d;--brand-d:#0a463a;--line:#c9d3d0;--warn:#a84a08;--warn-bg:#fdf1e6;--mute:#4d5f64}
@media (prefers-color-scheme:dark){:root{--ink:#e8efed;--paper:#0f1819;--card:#17252a;--brand:#46b59f;--brand-d:#6fd0bb;--line:#2f4349;--warn:#f0a468;--warn-bg:#2a2016;--mute:#a8bbb7}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans Arabic","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:0 16px env(safe-area-inset-bottom,0px)}
.brandbar{background:#fff;border-bottom:1px solid #dfe7e4;margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.brand{max-width:480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;direction:ltr}
.brand img{height:60px;width:auto;display:block}
footer{margin-top:22px;text-align:center;font-size:.85rem;color:var(--mute)}
footer p{margin:0 0 8px}
footer a.wa{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px 4px 10px;margin-top:4px;direction:ltr}
footer a.wa:hover{border-color:#25D366}
footer a.wa svg{width:20px;height:20px;fill:#25D366;flex-shrink:0}
footer hr{border:0;border-top:1px solid var(--line);margin:14px 0}
footer .copy{font-weight:500;color:var(--ink)}
main{max-width:480px;margin:0 auto;padding:20px 0 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
h1{font-size:1.5rem;margin:0;font-weight:700}
#lang{font:inherit;font-size:.95rem;color:var(--brand);background:var(--card);border:1.5px solid var(--brand);border-radius:8px;padding:6px 10px;flex-shrink:0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
label,.legend{display:block;font-weight:500;margin:0 0 6px}
.field{margin-bottom:18px}
input[type=text],input[type=tel],input[type=date],select.f,textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:12px}
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
input:focus,textarea:focus,select:focus,button:focus-visible,.opt:focus-within{outline:3px solid var(--brand);outline-offset:2px}
.hint{margin:6px 0 0;font-size:.85rem;color:var(--mute)}
.ltr{direction:ltr;text-align:start}
html[dir=rtl] .ltr{text-align:right}
.phone{display:flex;direction:ltr;gap:8px}
.phone span{display:flex;align-items:center;padding:0 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);font-weight:700;min-width:64px;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;background:var(--paper)}
.opt input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.opt:has(input:checked){border-color:var(--brand);background:var(--card)}
#why-wrap{display:none;background:var(--warn-bg);border-inline-start:4px solid var(--warn);border-radius:8px;padding:14px;margin-bottom:18px}
#why-wrap.show{display:block}
#why-wrap label{color:var(--warn)}
textarea{min-height:96px;resize:vertical}
.send{width:100%;font:inherit;font-weight:700;font-size:1.05rem;background:var(--brand);color:var(--card);border:0;border-radius:8px;padding:14px;cursor:pointer}
.send:hover{background:var(--brand-d)}
.send:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-weight:500}
.msg.err{color:var(--warn)}
#done{display:none;text-align:center;padding:12px 0}
#done h2{color:var(--brand);margin:0 0 6px}
#done button{margin-top:12px;font:inherit;background:transparent;border:1.5px solid var(--brand);color:var(--brand);border-radius:8px;padding:10px 18px;cursor:pointer}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
</style>
</head>

var EX = {EG:"1012345678",PK:"3012345678",IN:"9876543210",NP:"9812345678",BD:"1712345678",LK:"712345678",SD:"912345678",YE:"712345678",PH:"9171234567"};
var RTL = {ar:1, ur:1}, lang = "en";
var $ = function(s){return document.querySelector(s)};
var f = $("#f"), msg = $("#msg"), natEl = $("#nat"), airEl = $("#air"), phEl = $("#ph");

// Accept Arabic, Urdu and Nepali digits
function nd(s){return s.replace(/[٠-٩۰-۹०-९]/g, function(c){var x = c.charCodeAt(0); return x >= 0x966 ? x - 0x966 : x >= 0x6F0 ? x - 0x6F0 : x - 0x660})}

function opt(v, t, dis){var o = document.createElement("option"); o.value = v; o.textContent = t; if(dis) o.disabled = true; return o}

function fillAir(){
  var t = T[lang], n = natEl.value, cur = airEl.value;
  airEl.innerHTML = "";
  airEl.appendChild(opt("", n ? t.airPh : t.airFirst, true));
  if(n) C[n].ap.forEach(function(p){airEl.appendChild(opt(p[0], p[0] + " — " + p[1]))});
  airEl.value = n ? cur : "";
  airEl.disabled = !n; phEl.disabled = !n;
  $("#cc").textContent = n ? "+" + C[n].cc : "+";
  var h = $("#h-phone");
  h.textContent = n ? t.h_phone + " " : t.h_phone0;
  if(n){var b = document.createElement("bdi"); b.dir = "ltr"; b.textContent = EX[n]; h.appendChild(b)}
}

function fillNat(){
  var cur = natEl.value;
  natEl.innerHTML = "";
  natEl.appendChild(opt("", T[lang].natPh, true));
  Object.keys(C).forEach(function(k){natEl.appendChild(opt(k, C[k].n[lang]))});
  natEl.value = cur;
  fillAir();
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = RTL[l] ? "rtl" : "ltr";
  document.title = T[l].title;
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent = T[l][el.dataset.i18n]});
  fillNat();
  msg.textContent = "";
}
$("#lang").addEventListener("change", function(){setLang(this.value)});

natEl.addEventListener("change", function(){airEl.value = ""; phEl.value = ""; fillAir()});

var today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
$("#date").min = today.toISOString().slice(0,10);

function isEmergency(){return f.querySelector("input[name=type]:checked").value === "emergency"}
f.querySelectorAll("input[name=type]").forEach(function(r){
  r.addEventListener("change", function(){$("#why-wrap").classList.toggle("show", isEmergency())});
});

function fail(key, el){msg.className = "msg err"; msg.textContent = T[lang][key]; if(el) el.focus()}

f.addEventListener("submit", function(e){
  e.preventDefault();
  msg.className = "msg";
  var name = $("#name").value.trim(), iqama = nd($("#iqama").value.trim()), n = natEl.value, ap = airEl.value;
  var ph = nd(phEl.value).replace(/\D/g, "").replace(/^0+/, ""), date = $("#date").value, why = $("#why").value.trim();
  if(!name) return fail("eName", $("#name"));
  if(!/^\d{10}$/.test(iqama)) return fail("eIqama", $("#iqama"));
  if(!n || !C[n]) return fail("eNat", natEl);
  if(!C[n].ap.some(function(p){return p[0] === ap})) return fail("eAir", airEl);
  if(!new RegExp(C[n].re).test(ph)) return fail("ePhone", phEl);
  if(!date) return fail("eDate", $("#date"));
  if(isEmergency() && !why) return fail("eWhy", $("#why"));
  if(!SCRIPT_URL) return fail("eCfg");

  var btn = f.querySelector(".send");
  btn.disabled = true; btn.textContent = T[lang].sending;
  var payload = {name:name, iqama:iqama, natCode:n, nat:C[n].n.en, airport:ap, phone:"+" + C[n].cc + ph, phoneNat:ph, date:date,
    type: isEmergency() ? "Emergency / طارئة" : "Due / مستحقة", why: isEmergency() ? why : "", lang:lang};

  fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)})
    .then(function(){f.style.display = "none"; $("#done").style.display = "block"})
    .catch(function(){fail("eNet")})
    .finally(function(){btn.disabled = false; btn.textContent = T[lang].send});
});

$("#again").addEventListener("click", function(){
  f.reset(); fillAir(); $("#why-wrap").classList.remove("show");
  $("#done").style.display = "none"; f.style.display = "block"; msg.textContent = "";
});

$("#yr").textContent = new Date().getFullYear();
$("#lang").value = "en";
setLang("en");
</script>
